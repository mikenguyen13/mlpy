<!DOCTYPE html>
<!--
  Replaces the bare meta-refresh stub Jupyter Book generates at the site root.
  Copied verbatim over _build/html/index.html by html_extra_path (see _config.yml),
  which runs after the Sphinx build. Still redirects to the book's first page, but
  now carries a title, description and canonical so the root URL - the one listed
  in sitemap.xml and the one people link to - is not a contentless document.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Machine Learning in Python — Mike Nguyen</title>
<meta name="description" content="An open-source book on machine learning in Python: supervised learning, regularization, matrix factorization, optimization, big data workflows, and applied case studies in credit scoring, fraud detection, text similarity and bandits." />
<link rel="canonical" href="https://mikenguyen13.github.io/mlpy/intro.html" />
<meta name="robots" content="index, follow" />
<meta property="og:type" content="book" />
<meta property="og:title" content="Machine Learning in Python" />
<meta property="og:description" content="An open-source book on machine learning in Python: supervised learning, regularization, matrix factorization, optimization, big data workflows, and applied case studies." />
<meta property="og:url" content="https://mikenguyen13.github.io/mlpy/intro.html" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Machine Learning in Python" />
<meta name="twitter:description" content="An open-source book on machine learning in Python, with applied case studies." />
<meta http-equiv="refresh" content="0; url=intro.html" />
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "name": "Machine Learning in Python",
  "author": {"@type": "Person", "name": "Mike Nguyen"},
  "inLanguage": "en",
  "url": "https://mikenguyen13.github.io/mlpy/intro.html",
  "description": "An open-source book on machine learning in Python: supervised learning, regularization, matrix factorization, optimization, big data workflows, and applied case studies."
}
</script>
</head>
<body>
<h1>Machine Learning in Python</h1>
<p>Redirecting to <a href="intro.html">the introduction</a>&hellip;</p>
<script>window.location.replace("intro.html");</script>
</body>
</html>
